name: Build Windows .exe

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test MediaSort.exe
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Override the local .python-version pin with the CI interpreter.
      UV_PYTHON: "3.12.10"
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python with Tkinter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run regression tests
        run: uv run --locked python -m unittest discover -s tests

      - name: Build executable
        run: uv run --locked build.py

      - name: Smoke-test the packaged GUI
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/MediaSort.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          $window = $null
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $process.Refresh()
              if ($process.HasExited) {
                throw "MediaSort exited before opening a window (code $($process.ExitCode))."
              }
              # A one-file PyInstaller executable opens its GUI in a child process.
              $ids = @($process.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($process.Id)" | Select-Object -ExpandProperty ProcessId)
              foreach ($id in $ids) {
                $candidate = Get-Process -Id $id -ErrorAction SilentlyContinue
                if ($candidate) {
                  $candidate.Refresh()
                  if ($candidate.MainWindowHandle -ne [IntPtr]::Zero) {
                    # Retain a handle so ExitCode remains available after closing.
                    $null = $candidate.Handle
                    $window = $candidate
                    break
                  }
                }
              }
              if (-not $window) { Start-Sleep -Milliseconds 250 }
            } until ($window -or (Get-Date) -ge $deadline)
            if (-not $window) { throw 'MediaSort did not create a visible main window within 60 seconds.' }
            Write-Host "Visible GUI: $($window.MainWindowTitle) (handle $($window.MainWindowHandle))"
            if (-not $window.CloseMainWindow()) { throw 'MediaSort rejected the window close request.' }
            if (-not $window.WaitForExit(15000)) { throw 'MediaSort did not close cleanly.' }
            if ($window.ExitCode -ne 0) { throw "GUI exited with code $($window.ExitCode)." }
            if (-not $process.WaitForExit(15000)) { throw 'The packaged launcher did not exit.' }
            if ($process.ExitCode -ne 0) { throw "Launcher exited with code $($process.ExitCode)." }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { $process.Kill($true) }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSort-Windows
          path: dist/MediaSort.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach verified executable to release
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: MediaSort-Windows
          path: dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/MediaSort.exe
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}
