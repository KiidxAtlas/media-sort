[project]
name = "media-sort"
version = "1.2.1"
description = "GUI tool to organize videos and images into categorized folders"
readme = "README.md"
authors = [
    { name = "Atlas", email = "KiidxAtlas@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=6.0.0",
]

[project.gui-scripts]
media-sort = "media_sort.__main__:main"

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
