[project]
name = "media-sort"
version = "0.1.0"
description = "GUI tool to organize videos and images into categorized folders"
readme = "README.md"
authors = [
    { name = "Atlas", email = "KiidxAtlas@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
media-sort = "media_sort:main"

[project.scripts]
media-sort-cli = "media_sort:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
